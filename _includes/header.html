<header class="site-header">
  <div class="wrap header-row">
    <div class="brand">
      <p class="site-title"><a href="{{ '/' | relative_url }}"><span class="l-fr" lang="fr">{{ site.title_fr }}</span><span class="l-en" lang="en">{{ site.title }}</span></a></p>
      <p class="site-tagline"><span class="l-en" lang="en">{{ site.tagline_en }}</span><span class="l-fr" lang="fr">{{ site.tagline_fr }}</span></p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language / Langue">
      <button type="button" data-set-lang="fr" aria-pressed="true" lang="fr" title="Français">FR</button><button type="button" data-set-lang="en" aria-pressed="false" lang="en" title="English">EN</button>
    </div>
  </div>
</header>
