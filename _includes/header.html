<header class="site-header">
  <div class="wrap header-row">
    <div class="brand">
      <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
      <p class="site-tagline"><span class="l-en" lang="en">{{ site.tagline_en }}</span><span class="l-fr" lang="fr">{{ site.tagline_fr }}</span></p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Language / Langue">
      <button type="button" data-set-lang="en" aria-pressed="true" lang="en">EN</button><span class="sep" aria-hidden="true">|</span><button type="button" data-set-lang="fr" aria-pressed="false" lang="fr">FR</button>
    </div>
  </div>
</header>
