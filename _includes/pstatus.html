{%- comment -%} Promised vs delivered status badge (symbol + text, never colour alone). Param: s (status id). {%- endcomment -%}
{%- assign ps = site.data.promise_status.items | where: "id", include.s | first -%}
{%- if ps %}<span class="pst pst-{{ ps.id }}"><span class="pst-mark" aria-hidden="true">{{ ps.mark }}</span><span class="l-fr" lang="fr">{{ ps.fr }}</span><span class="l-en" lang="en">{{ ps.en }}</span></span>{% endif -%}
